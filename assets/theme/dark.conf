# ==========================================
# biway Material Neon Dark Theme (dark.conf)
# ==========================================

[colors]
# 1. Primary Accents
color_primary              = #00f0ff    # Cyber Neon Cyan highlight (Active window border, Active workspace pill)
color_on_primary           = #050510    # Deep black text on neon cyan badge
color_primary_container    = #003b4d    # Electric cyan glow container for selected menu items
color_on_primary_container = #b3f7ff    # Bright neon cyan text inside selected items

# 2. Secondary Accents
color_secondary            = #1b1f38    # Deep neon midnight button ([ ☰ Menu ] button)
color_on_secondary         = #e2e8f0    # High-contrast light text on secondary buttons

# 3. Surfaces & Backgrounds
color_background           = #090a107f    # Deep OLED midnight black for Top Bar
color_surface              = #10121d7f    # Elevated dark modal card background
color_surface_variant      = #1a1d2e    # Deep indigo for Search input box & Inactive workspace pills

# 4. Typography & Foreground
color_on_surface           = #f1f5f9    # Crisp white-blue readable text (Clock, Active title, App names)
color_on_surface_variant   = #818cf8    # Neon lavender text for subtitles, category hints, inactive numbers

# 5. Outlines & Borders
color_outline              = #2e3856    # Neon indigo outlines for inactive windows & cards
color_outline_variant      = #1e2238    # Subtle divider line under Top Bar

exec = theme/darkmodescript.sh
