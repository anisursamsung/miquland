# ==========================================
# biway Material Neon Light Theme (light.conf)
# ==========================================
wallpaper = /usr/share/biway/theme/lightwallpaper.png

[colors]
# 1. Primary Accents
color_primary              = #0066ff    # Electric Neon Azure (Active window border, Active workspace pill)
color_on_primary           = #ffffff    # White on primary badge
color_primary_container    = #cce5ff    # Soft electric blue container for selected menu items
color_on_primary_container = #002b66    # Deep high-contrast blue text inside selected items

# 2. Secondary Accents
color_secondary            = #e6f0fa    # Crisp icy secondary button ([ ☰ Menu ] button)
color_on_secondary         = #0f172a    # Deep slate text on secondary buttons

# 3. Surfaces & Backgrounds
color_background           = #f4f8fc    # Clean icy off-white base for Top Bar
color_surface              = #ffffff    # Pure white background for Application Menu modal
color_surface_variant      = #e6eff8    # Ice gray for Search input box & Inactive workspace pills

# 4. Typography & Foreground
color_on_surface           = #0f172a    # Sharp dark slate readable text (Clock, Active title, App names)
color_on_surface_variant   = #475569    # Medium slate for subtitles, category hints, inactive workspace numbers

# 5. Outlines & Borders
color_outline              = #99c2ff    # Subtle neon-tinted border for inactive windows & cards
color_outline_variant      = #dbeafe    # Soft divider line under Top Bar
