# miquland configuration file
# A modern dynamic tiling Wayland compositor
# Load overview plugin
plugin = /usr/lib/miquland/plugins/libmiquoverview.so

# Overview hotkey
bind = SUPER, Tab, overview_toggle
# ==========================================
# Autostart
# ==========================================
exec_once = miqubg &
autostart = nm-applet &
exec_once = dunst &
autostart = waybar &
exec_always = wl-paste --watch cliphist store
autostart = miqupolkit &
autostart = miqudesk &
autostart = miquidle &

# --- Ecosystem Companions (Native Protocol Support) ---
# Night Mode / Blue Light Filter (wlr-gamma-control):
# exec_once = gammastep -O 4500 &
# Idle Management & Auto-Lock (ext-idle-notify-v1 & wlr-output-power-management):
# exec_once = swayidle -w timeout 300 'miqulock' timeout 600 'wlr-randr --output eDP-1 --off' resume 'wlr-randr --output eDP-1 --on' &

# ==========================================
# Appearance & Cursor
# ==========================================
cursor_theme = default
cursor_size = 24

# ==========================================
# Monitors & Display Configuration
# Format: monitor = <name>, <resolution>@<refresh_rate>, <position>, <scale>, [transform]
#
# Examples:
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
# monitor = DP-1, disable
# ==========================================
# Default fallback for all displays (auto-detect resolution, refresh rate, and layout position):
monitor = , preferred, auto, 1

# ==========================================
# Input Settings
# ==========================================
# Keyboard Layout & Options (XKB)
kb_layout = us
# kb_variant =
# kb_options = grp:alt_shift_toggle,caps:escape
# kb_model =
repeat_rate = 25
repeat_delay = 600

# Touchpad & Mouse
tap_to_click = true
natural_scroll = false
disable_while_typing = true
accel_speed = 0.0
accel_profile = adaptive
focus_follows_mouse = true

# Touchscreen
# touchscreen_output = eDP-1

# ==========================================
# Window Tiling, Borders & Gaps
# ==========================================
# Layout algorithm:
# - 'spiral' : Recursive binary space partitioning (Fibonacci / BSP).
#              Splits alternate horizontally and vertically.
# - 'stack'  : Master-and-stack column layout. Main window on the left,
#              vertical stack for secondary windows on the right.
layout = spiral

# Default split ratio (0.1 to 0.9, default: 0.5)
default_split_ratio = 0.5

# Window border width and corner rounding radius (in pixels)
window_border_width = 2
window_border_radius = 10

# Gaps: space between tiled windows and padding from screen edges
space_between_windows = 8
screen_edge_padding = 12

# Smart Gaps: Automatically collapse gaps and padding when only one window is tiled
smart_gaps = false

# Workspace cycle: When moving past the last/first workspace, cycle around
workspace_cycle = false

# when false, if you keep swiping, new workspaces will keep creating. Nice though.

# Direct mouse drag resize on borders (without holding Super):
resize_on_border = true
border_grab_area = 6

# ==========================================
# Animations (Master Toggle)
# ==========================================
# Master toggle for all animations in miquland (workspace & window)
animations = true

# ==========================================
# Workspace Animations & Transitions
# ==========================================
# Enable GPU-accelerated workspace slide & swipe transitions
# Available curves: default, overshoot, smooth_out, md3_decel, ease_out_cubic, ease_in_out_circ, bezier(x1, y1, x2, y2)
workspace_animations = true
workspace_animation_duration = 300
workspace_animation_curve = smooth_out

# ==========================================
# Window Animations (Open, Close & Tiling Transitions)
# ==========================================
# Enable GPU-accelerated window open (pop-in bounce), close (shrink/fade), and tiling re-layout transitions
# Available curves: default (overshoot pop-in), smooth_out (rapid clean exit), overshoot, md3_decel, ease_out_cubic, ease_in_out_circ, bezier(x1,y1,x2,y2)
window_animations = true

# Durations in milliseconds (open: springy pop-in, close: rapid exit)
window_animation_open_duration = 260
window_animation_close_duration = 200

# Easing curves for open and close (ease_out_cubic provides silky-smooth glide without bumpy overshoot)
window_animation_open_curve = ease_out_cubic
window_animation_close_curve = ease_out_cubic

# Initial scale on spawn (open) and final scale on exit (close)
# e.g., 0.85 starts at 85% size and glides to 100% on open; shrinks from 100% to 80% on close
window_animation_open_scale = 0.82
window_animation_close_scale = 0.80

# Opacity fading during open/close animations:
# - true  : Smoothly fades from 0.0 -> target opacity on open, and current opacity -> 0.0 on close
# - false : Keeps steady opacity throughout the scale animation without fading
window_animation_fade = true

# Independent Fade Controls (optional fine-tuning):
# By default, fade durations and curves inherit from the open/close scale animations above.
# Uncomment below if you wish to make opacity fade faster or slower than scaling:
# window_animation_fade_in_duration = 320
# window_animation_fade_out_duration = 240
# window_animation_fade_in_curve = default
# window_animation_fade_out_curve = smooth_out

# Window Opacity (0.0 = transparent, 1.0 = fully opaque)
window_opacity_active = 1.0
window_opacity_inactive = 1.0

# Window border colors (active and inactive):
window_border_color_active = #0066ff
window_border_color_inactive = #99c2ff

# ==========================================
# Blur Effects (SceneFX Dual Kawase)
# ==========================================
# Enable hardware-accelerated Dual Kawase background blur
blur = true

# Radius (spread) and number of downsampling passes
blur_radius = 5
blur_passes = 3

# Visual fine-tuning
blur_noise = 0.02
blur_brightness = 0.9
blur_contrast = 0.9
blur_saturation = 1.1

# ==========================================
# Layer Surface Animations (Bars, Docks, Launchers, Overlays)
# ==========================================
# Enable animations for layer surfaces (bars slide from screen edge, launchers pop-in from center)
layer_animations = true
layer_animation_duration = 280
layer_animation_curve = ease_out_cubic
layer_animation_popin_scale = 0.80

# Layer Rules (Blur & Animation overrides per layer shell namespace):
# Formats:
#   layerrule = blur, <namespace>
#   layerrule = animation <slide|slide top|slide bottom|slide left|slide right|popin|popin <scale%>|fade|none>, <namespace>
#   layerrule = noanim, <namespace>
layerrule = blur, waybar
layerrule = blur, miqulauncher
layerrule = animation slide, waybar
layerrule = animation popin 88%, miqulauncher
layerrule = animation popin, miqupolkit
layerrule = animation slide_bottom, wallpaper
layerrule = animation slide_bottom, miqubg
# layerrule = blur, miquclock
# layerrule = blur, rofi

# ==========================================
# Window Rules
# Format: windowrule = <action> [extra], <target>
# Supported actions: float, workspace <N>, opacity <val>
# Targets: class:<app_id>, title:<regex>, or <app_id>
# ==========================================
windowrule = float, xdg-desktop-portal-gtk
windowrule = float, org.freedesktop.impl.portal.desktop.gtk
windowrule = float, zenity
# windowrule = float, Mullvad Browser
windowrule = float, Tor Browser
# windowrule = float, class:pavucontrol
# windowrule = workspace 2, class:firefox
# windowrule = opacity 0.85, class:kitty

# ==========================================
# Applications
# ==========================================
terminal = kitty

# ==========================================
# Keybindings
# Format: bind = <Modifiers>+<Key>, <Action/Command>
# ==========================================

# --- System & Terminal ---
bind = Super+Shift+Q, exit
bind = Super+T, terminal

# --- Application Launchers (Configurable) ---
bind = Super+Space, miqulauncher
bind = Super+F, firefox
bind = Super+E, kitty -e yazi
bind = Super+Alt+L, miqulock

# --- Window Management & Layout (Hyprland Ergonomics) ---
bind = Super+Q, close
bind = Super+V, toggle_floating
bind = Super+M, toggle_fullscreen
bind = Super+Shift+F, toggle_fullscreen
bind = Super+L, toggle_layout
bind = Super+Return, swap_main

# --- Mouse Controls (Hyprland style) ---
# Super + Left Click Drag  : Drop-to-Swap tiles (or move floating windows)
# Super + Right Click Drag : Resize floating window
# Left Click Drag on Border: Directly resize window without holding Super

# --- Focus Navigation ---
bind = Super+J, next_window
bind = Super+K, prev_window
bind = Super+Left, prev_window
bind = Super+Right, next_window
bind = Super+Up, prev_window
bind = Super+Down, next_window
bind = Super+1, focus_win_1
bind = Super+2, focus_win_2

# Toggle between Horizontal and Vertical split orientation
bind = Super+Alt+Space, toggle_split

# --- Workspace Navigation ---
bind = Super+Shift+Left, prev_ws
bind = Super+Shift+Right, next_ws

# Switch directly to workspace 1..10 (Super+Shift+1..0)
bind = Super+Shift+1, ws_1
bind = Super+Shift+2, ws_2
bind = Super+Shift+3, ws_3
bind = Super+Shift+4, ws_4
bind = Super+Shift+5, ws_5
bind = Super+Shift+6, ws_6
bind = Super+Shift+7, ws_7
bind = Super+Shift+8, ws_8
bind = Super+Shift+9, ws_9
bind = Super+Shift+0, ws_10

# Switch directly to workspace 11..20 (Super+Ctrl+1..0)
bind = Super+Ctrl+1, ws_11
bind = Super+Ctrl+2, ws_12
bind = Super+Ctrl+3, ws_13
bind = Super+Ctrl+4, ws_14
bind = Super+Ctrl+5, ws_15
bind = Super+Ctrl+6, ws_16
bind = Super+Ctrl+7, ws_17
bind = Super+Ctrl+8, ws_18
bind = Super+Ctrl+9, ws_19
bind = Super+Ctrl+0, ws_20

# --- Move Window to Workspace ---
# Move window directly to workspace 1..10 (Super+Alt+1..0)
bind = Super+Alt+1, move_ws_1
bind = Super+Alt+2, move_ws_2
bind = Super+Alt+3, move_ws_3
bind = Super+Alt+4, move_ws_4
bind = Super+Alt+5, move_ws_5
bind = Super+Alt+6, move_ws_6
bind = Super+Alt+7, move_ws_7
bind = Super+Alt+8, move_ws_8
bind = Super+Alt+9, move_ws_9
bind = Super+Alt+0, move_ws_10

# Move window directly to workspace 11..20 (Super+Ctrl+Alt+1..0)
bind = Super+Ctrl+Alt+1, move_ws_11
bind = Super+Ctrl+Alt+2, move_ws_12
bind = Super+Ctrl+Alt+3, move_ws_13
bind = Super+Ctrl+Alt+4, move_ws_14
bind = Super+Ctrl+Alt+5, move_ws_15
bind = Super+Ctrl+Alt+6, move_ws_16
bind = Super+Ctrl+Alt+7, move_ws_17
bind = Super+Ctrl+Alt+8, move_ws_18
bind = Super+Ctrl+Alt+9, move_ws_19
bind = Super+Ctrl+Alt+0, move_ws_20

# --- Media & Brightness Controls ---
bind = XF86AudioPlay, playerctl play-pause
bind = XF86AudioNext, playerctl next
bind = XF86AudioPrev, playerctl previous
bind = XF86AudioRaiseVolume, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = XF86AudioLowerVolume, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = XF86AudioMute, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = XF86MonBrightnessUp, brightnessctl set +10%
bind = XF86MonBrightnessDown, brightnessctl set 10%-

# --- Screenshots & Screen Recording (wlr-screencopy-v1) ---
# Fullscreen screenshot:
# bind = Print, grim ~/Pictures/screenshot-$(date +%s).png
# Region selection screenshot:
 bind = Shift+Print, slurp | grim -g - ~/Pictures/screenshot-$(date +%s).png
# Copy region screenshot to clipboard:
# bind = Ctrl+Print, slurp | grim -g - - | wl-copy

# ==========================================
# XWayland Settings
# ==========================================
# Hyprland-style unscaling for XWayland apps on HiDPI / fractional scaled displays.
# Prevents compositor blur/pixelation, enabling crisp 1:1 rendering.
xwayland {
    force_zero_scaling = true
}

# ==========================================
# Touchpad & Touchscreen Gestures
# ==========================================
# Touchpad Sensitivity:
# - touchpad_workspace_swipe_multiplier : 3-finger workspace drag speed on touchpad (default: 1.0, >1.0 faster, <1.0 slower)
# - touchpad_swipe_threshold           : Minimum swipe distance in pixels on touchpad before discrete gesture triggers (default: 50)
touchpad_workspace_swipe_multiplier = 1.0
touchpad_swipe_threshold = 50

# Touchscreen Sensitivity:
# - touchscreen_workspace_swipe_multiplier : 3-finger workspace drag speed on screen (default: 1.0 for 1:1 finger tracking)
# - touchscreen_swipe_threshold           : Minimum swipe distance in pixels on screen before discrete gesture triggers (default: 100)
touchscreen_workspace_swipe_multiplier = 1.0
touchscreen_swipe_threshold = 100

# Gesture Dynamics & Kinetic Physics:
# - workspace_swipe_cancel_ratio       : Distance fraction of screen width (e.g. 0.30 = 30%) to commit switch on slow release (default: 0.30)
# - workspace_swipe_min_speed_to_force : Minimum release velocity in px/ms to commit a flick switch regardless of distance (default: 0.3)
# - workspace_swipe_edge_resistance    : Elastic spring resistance factor when dragging against workspace boundaries (default: 0.15)
workspace_swipe_cancel_ratio = 0.30
workspace_swipe_min_speed_to_force = 0.3
workspace_swipe_edge_resistance = 0.15


# Format: gesture = swipe:<fingers>:<direction>, <action/command>
# Directions: left, right, up, down
# Supported actions: next_ws, prev_ws, toggle_fullscreen, toggle_floating,
#                    toggle_layout, toggle_split, swap_main, close,
#                    miqulauncher, miqulock, terminal, or any custom command/app
# Note: Horizontal 3-finger swipe runs smooth interactive workspace sliding when
#       workspace_animations is enabled. Vertical and 4-finger gestures trigger discrete actions.
# ==========================================
gesture = swipe:3:left, next_ws
gesture = swipe:3:right, prev_ws
gesture = swipe:3:up, toggle_fullscreen
gesture = swipe:3:down, toggle_floating
gesture = swipe:4:up, miqulauncher
gesture = swipe:4:down, miqulock
