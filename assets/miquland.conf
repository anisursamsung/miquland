# miquland configuration file
# A modern dynamic tiling Wayland compositor

# ==========================================
# Autostart
# ==========================================
exec_once = dunst &
autostart = waybar &
exec_always = wl-paste --watch cliphist store

# ==========================================
# Appearance & Icons
# ==========================================
icon_theme = Papirus

# ==========================================
# Theme & Colors Configuration
# ==========================================
# Source an external theme file (e.g. light.conf or dark.conf)
[theme]
source = ~/.config/miquland/theme/theme_mode.conf

# ==========================================
# Input Settings
# ==========================================
tap_to_click = true
natural_scroll = false

# ==========================================
# Window Tiling, Borders & Gaps
# ==========================================
[windows]
# Layout algorithm: 'spiral' (recursive binary space partitioning) or 'stack' (main + vertical column)
layout = spiral
window_border_width = 3
window_border_radius = 20
space_between_windows = 10
screen_edge_padding = 20
# Window Opacity (0.0 = transparent, 1.0 = fully opaque)
window_opacity_active = 1.0
window_opacity_inactive = 0.85

# ==========================================
# Applications
# ==========================================
terminal = kitty

# ==========================================
# Keybindings
# Format: bind = <Modifiers>+<Key>, <Action/Command>
# ==========================================

# --- System Reserved (Hardcoded) ---
# Super + Shift + Q : Exit compositor safely
# Super + T         : Launch terminal

# --- Application Launchers (Configurable) ---
bind = Super+Space, miqulauncher
bind = Super+F, firefox
bind = Super+E, kitty -e yazi

# --- Window Management & Layout ---
bind = Super+Q, close
bind = Super+L, toggle_layout
bind = Super+Return, swap_main

# --- Focus Navigation ---
bind = Super+J, next_window
bind = Super+K, prev_window
bind = Super+Left, prev_window
bind = Super+Right, next_window
bind = Super+Up, prev_window
bind = Super+Down, next_window
bind = Super+1, focus_win_1
bind = Super+2, focus_win_2

# Toggle between Horizontal and Vertical split orientation
bind = Super+Alt+Space, toggle_split

# --- Workspace Navigation ---
bind = Super+Shift+Left, prev_ws
bind = Super+Shift+Right, next_ws

# Switch directly to workspace 1..10 (Super+Shift+1..0)
bind = Super+Shift+1, ws_1
bind = Super+Shift+2, ws_2
bind = Super+Shift+3, ws_3
bind = Super+Shift+4, ws_4
bind = Super+Shift+5, ws_5
bind = Super+Shift+6, ws_6
bind = Super+Shift+7, ws_7
bind = Super+Shift+8, ws_8
bind = Super+Shift+9, ws_9
bind = Super+Shift+0, ws_10

# Switch directly to workspace 11..20 (Super+Ctrl+1..0)
bind = Super+Ctrl+1, ws_11
bind = Super+Ctrl+2, ws_12
bind = Super+Ctrl+3, ws_13
bind = Super+Ctrl+4, ws_14
bind = Super+Ctrl+5, ws_15
bind = Super+Ctrl+6, ws_16
bind = Super+Ctrl+7, ws_17
bind = Super+Ctrl+8, ws_18
bind = Super+Ctrl+9, ws_19
bind = Super+Ctrl+0, ws_20


# --- Media & Brightness Controls ---
bind = XF86AudioPlay, playerctl play-pause
bind = XF86AudioNext, playerctl next
bind = XF86AudioPrev, playerctl previous
bind = XF86AudioRaiseVolume, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = XF86AudioLowerVolume, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = XF86AudioMute, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = XF86MonBrightnessUp, brightnessctl set +10%
bind = XF86MonBrightnessDown, brightnessctl set 10%-
